name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAKE_ARTIFACT_CACHE: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Git consumers fetch from this checkout; a shallow source rejects that fetch.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: false
          build: true
          build-args: VersoCast VersoCastTests cast-assets cast-standard-html cast-blog-html
          test: true
          use-github-cache: false
          use-mathlib-cache: false
      - name: Check public consumer
        working-directory: tests/downstream
        run: |
          lake build
          lake exe consumer
      - name: Check clean Git package consumers
        run: node tests/git-consumer.mjs
      - name: Install locked browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check packaged JavaScript helper
        run: npm run test:js-package
      - name: Check real React SSR and Chromium
        # VIR's widget bundle is built only after root npm tooling is installed.
        run: |
          lake build VersoCastExamples
          npm run test:reference-setup
          npm test
      - name: Check optional Slides package and public consumer
        run: |
          cd packages/slides
          lake build
          cd ../../tests/slides
          lake build CastSlides CastSlides.PublicApi
          cd ../..
          npm run test:slides
          npm run test:comparison-demo
      - name: Check pinned reference manual preview
        # The manual copy shares Cast dependencies; keep this after other builds.
        run: npm run test:reference-manual
